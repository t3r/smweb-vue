name: Publish fgsmdb to PyPI

on:
  push:
    tags:
      - "fgsmdb-v*"
    paths:
      - "fgsmdb/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        working-directory: fgsmdb
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: fgsmdb/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
